name: bootstrap
on: [pull_request, push]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python -m pytest data_pipeline/tests backend/tests tests/integration -q
      - run: python -m data_pipeline.normalize --validate-only
      - run: python -m scripts.validate_examples
      - run: python -m scripts.check_generated
      - run: npm ci
        working-directory: frontend
      - run: npm run check:generated
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m scripts.smoke_servers
